name: Check Omasnap Release

on:
  schedule:
    - cron: "0 */1 * * *"   # every hour
  workflow_dispatch: {}

permissions:
  contents: write   # needed to push current_version.txt updates

env:
  UPSTREAM_REPO: tobi/omasnap

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine latest Omasnap version
        id: latest
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          API_URL="https://api.github.com/repos/${UPSTREAM_REPO}/releases/latest"
          echo "Fetching latest release from ${API_URL}"
          curl -sSL --fail-with-body \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -o /tmp/gh_response.json -w "HTTP Status: %{http_code}\n" \
            "${API_URL}" || { echo "Response body:"; cat /tmp/gh_response.json; exit 1; }
          LATEST=$(jq -er '.tag_name' /tmp/gh_response.json | sed 's/^v//')
          echo "latest=${LATEST}" >> "$GITHUB_OUTPUT"

      - name: Compare with current_version.txt
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          if [ -f current_version.txt ]; then
            CURRENT=$(tr -d ' \t\n\r' < current_version.txt)
          else
            CURRENT=""
          fi

          echo "Current version: '${CURRENT}'"
          echo "New version: '${{ steps.latest.outputs.latest }}'"

          if [ "${{ steps.latest.outputs.latest }}" != "${CURRENT}" ]; then
            echo "Version has changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version has not changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    runs-on: ubuntu-latest
    needs: check
    if: needs.check.outputs.changed == 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate PKGBUILD
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.latest }}
        run: |
          set -euo pipefail

          # Download the release tarball and compute its sha256sum.
          # A tagged release may exist for a few minutes before the upstream build
          # workflow attaches this asset, so fail loudly instead of hashing an
          # error page: current_version.txt stays put and the next run retries.
          TARBALL="omasnap-${VERSION}-archlinux-x86_64.tar.gz"
          curl -fL --retry 3 --retry-delay 10 -o "${TARBALL}" \
            "https://github.com/${UPSTREAM_REPO}/releases/download/v${VERSION}/${TARBALL}"
          TARBALL_SHA256=$(sha256sum "${TARBALL}" | awk '{print $1}')
          echo "Tarball sha256: ${TARBALL_SHA256}"

          # Replace variables in the template
          sed -e "s/\[\[VERSION\]\]/${VERSION}/g" \
              -e "s/\[\[TARBALL_SHA256\]\]/${TARBALL_SHA256}/g" \
              PKGBUILD-template > PKGBUILD

          echo "----- Generated PKGBUILD -----"
          cat PKGBUILD

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.2
        with:
          pkgname: omasnap-bin
          pkgbuild: ./PKGBUILD
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to version ${{ needs.check.outputs.latest }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519

      - name: Update version file
        shell: bash
        run: |
          set -euo pipefail

          printf "%s\n" "${{ needs.check.outputs.latest }}" > current_version.txt

          # Commit the updated current_version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add current_version.txt
          git commit -m "Update to version ${{ needs.check.outputs.latest }}"
          git push
